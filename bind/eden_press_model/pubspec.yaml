name: eden_press_model
description: >-
  Pure-Dart mirror of the Eden Press document model (eden-press.model/v7):
  ModelDocument, Section, Block, ListItem, TextRun, OutlineEntry, Span, the
  typed sheet embed and the v7 page properties and comments, with fromJson and
  a toJson that reproduces Go's json.Marshal output. No Flutter, no FFI, no
  plugin and no native artifacts, so a host app can depend on it (or on
  eden_docs, which renders it) on every platform.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.4

# No `dependencies:` block on purpose: the model is plain Dart (dart:core
# only), which is what lets eden_docs drop the eden_press FFI plugin. Pins were
# confirmed by `dart pub add --dev test lints` resolution (1026-05) and written
# exactly, the bind/ house style.
dev_dependencies:
  lints: 6.1.0
  test: 1.33.0
