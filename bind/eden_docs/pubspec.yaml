name: eden_docs
description: >-
  Standalone Flutter renderer for Eden Press documents (eden-press.model/v7).
  Host apps depend on this package and pass a ModelDocument (or its JSON);
  blocks are painted as Flutter widgets — never as raw JSON dumps. Pair with
  the Go backend's --format json (or serve ?format=json) for the data path;
  browsers use --format html / ?format=html instead.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.5"

dependencies:
  flutter:
    sdk: flutter
  # The pure-Dart document model. NOT eden_press (../dart): that is an FFI
  # plugin whose native artifacts are gitignored build products, so a host app
  # depending on eden_docs could not build. test/pubspec_contract_test.dart
  # enforces this.
  eden_press_model:
    path: ../eden_press_model
  flutter_math_fork: 0.7.4
  flutter_highlighting: 0.9.0+11.8.0
  highlighting: 0.9.0+11.8.0
  flutter_svg: 2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Test-only: test/pubspec_contract_test.dart parses THIS file to lock the
  # no-FFI-plugin contract. Pin confirmed by `flutter pub add --dev yaml`.
  yaml: 3.1.4

flutter: {}
