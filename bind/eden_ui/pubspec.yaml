name: eden_ui
description: >-
  Embeddable Flutter editor surface for Eden documents, slides, and
  spreadsheets. A host application supplies a document or workbook and
  receives discrete edits; this package does not own accounts, storage,
  or realtime collaboration.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.5"

dependencies:
  flutter:
    sdk: flutter
  eden_press:
    path: ../dart
  two_dimensional_scrollables: ^0.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
