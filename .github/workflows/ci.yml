name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build / vet / test / license-header
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # -p 2: at most two packages at a time, so fewer headless Chromes start
        # at once on the shared runner (each Chrome-backed package launches its
        # own; all at once made startup slow enough to miss chromedp's window).
        # -skip: the CLI's live-Chrome end-to-end tests run in the export job
        # below, against the pinned headless-shell (EXP-04; `make export-test`).
        # On this runner's unpinned system Chrome (ubuntu-24.04 image
        # 20261012.334, Chrome/Chromium 155) TestEndToEndPNGWithoutInlineSVGFlag
        # hung to its 150 s bound on every run since 2026-10-19, while it passes
        # in about 0.2 s on the pinned 151 headless-shell, on headless-shell
        # 155.0.8059.40 and on Chrome 155 for macOS.
        run: go test -p 2 -skip '^TestEndToEndP(DFAndPNG|NGWithoutInlineSVGFlag)$' ./...

      - name: Install addlicense
        run: go install github.com/google/addlicense@latest

      - name: Check license headers
        # conformance/corpus/cases/** is Marp-derived golden data (rendered through
        # @marp-team/marp-core), NOT Eden Press source — it must NOT carry our
        # copyright header; its provenance is recorded in NOTICE. node_modules is
        # dev-only tooling deps. themes/** are verbatim Marp assets (CORE-01):
        # themes/*.css carry Marp's OWN /*! @theme … */ header (an added Eden header
        # would displace the leading @theme block chase/theme/meta.go parses) and
        # themes/browser-fit.js carries Marp's MIT header — all credited in NOTICE,
        # so they are excluded from the AO-Cyber header assertion. convert/chrome/
        # fonts/** is the vendored STIX Two Math OTF binary (EXP-04 font
        # provisioning, 05-02) — a font binary, not Eden Press source, so it is
        # excluded the same way conformance/corpus/cases/** is. internal/latex2mathml/**
        # is the in-repo fork of git.sr.ht/~mekyt/latex2mathml (Objective 8, 08-01) —
        # verbatim third-party MIT (Copyright (c) 2023 mekyt), redirected via a go.mod
        # replace; it carries mekyt's OWN LICENSE, not Eden's header, so it is excluded
        # the same way themes/** and convert/chrome/fonts/** are (see NOTICE). Everything
        # else must have the MIT header.
        run: addlicense -l mit -s -c "AO Cyber Systems" -ignore 'conformance/corpus/cases/**' -ignore '**/node_modules/**' -ignore 'themes/**' -ignore 'convert/chrome/fonts/**' -ignore 'internal/latex2mathml/**' -ignore '.github/workflows/oss-mirror.yml' -check .

      - name: Check no chromedp (API-02)
        # OBJECTIVE.md success criterion 2 + the Objective-7-begin gate: the
        # public render path (press/) and everything it composes (chase/,
        # profiles/) must stay pure-Go with NO headless-browser dependency, so
        # a consumer that imports only press/ never pulls in chromedp. This
        # mechanically enforces that boundary on every push/PR.
        run: make check-no-chromedp

      - name: Check CLI imports (CLI-04)
        # 04-08-TRD.md: cmd/eden-press's OWN source must import ONLY press/
        # from the engine -- never chase/, profiles/, or chromedp directly.
        # Mirrors the check-no-chromedp gate above, one level down at the
        # CLI-is-a-consumer-of-press-only boundary.
        run: make check-cli-imports

  export:
    name: export (pinned no-system-Chrome headless-shell container, EXP-04)
    runs-on: ubuntu-latest
    # A hung export (chromedp waits on a selector forever) must fail the job,
    # not hold a runner for the 6-hour default.
    timeout-minutes: 30
    env:
      # The SAME pinned tag as the Makefile's CHROME_VERSION var (see
      # convert/EXPORT.md's version-pin + PDF-re-validation process) — bump
      # both together, then re-run `make check-chrome-export` before
      # accepting the bump. NEVER "latest" (05-RESEARCH Pitfall A/11).
      CHROME_VERSION: '151.0.7922.34'
    steps:
      - uses: actions/checkout@v4

      - name: Build a Go + pinned-headless-shell image (NO system Chrome otherwise)
        # A throwaway multi-stage image, built for this job only: stage
        # "shell" is the PINNED chromedp/headless-shell:${CHROME_VERSION}
        # image, verbatim and unmodified — its /headless-shell tree is the
        # ONLY Chrome/Chromium binary that will exist anywhere in the final
        # image. The final stage is a plain Go toolchain image with NOTHING
        # chrome-related pre-installed; the headless-shell tree is COPIED in
        # from the pinned stage (never apt-installed, never `latest`). None
        # of convert/chrome/discover.go's tier-3 auto-detect candidate binary
        # names (google-chrome*, chromium*) exist anywhere in this image —
        # so the ONLY way Discover can resolve Chrome here is tier 2
        # (the CHROME_PATH env var, set below to the copied-in headless-shell
        # path), which is exactly what proves the EXP-04 discovery fallback
        # chain resolves Chrome from a genuinely clean, no-system-Chrome
        # container.
        #
        # The headless-shell binary links against shared libraries that the
        # pinned image installs in its OWN base layer (libnspr4, libnss3,
        # libexpat1, libfontconfig1, libuuid1 -- the chromedp/headless-shell
        # Dockerfile's apt list), so copying only the /headless-shell tree
        # left it unable to start ("libnspr4.so: cannot open shared object
        # file"). The final stage installs exactly those runtime libraries:
        # no Chrome/Chromium package and no binary named google-chrome* or
        # chromium*, so tier 2 (CHROME_PATH) is still the only way Discover
        # can resolve Chrome here.
        run: |
          cat > Dockerfile.export-ci <<'EOF'
          ARG CHROME_VERSION
          FROM chromedp/headless-shell:${CHROME_VERSION} AS shell

          FROM golang:1.27.1-bookworm
          RUN apt-get update \
            && apt-get install -y --no-install-recommends libnspr4 libnss3 libexpat1 libfontconfig1 libuuid1 \
            && rm -rf /var/lib/apt/lists/*
          COPY --from=shell /headless-shell /headless-shell
          RUN useradd --create-home --uid 10001 exporter
          USER exporter
          WORKDIR /workspace
          EOF
          docker build \
            --build-arg CHROME_VERSION="${CHROME_VERSION}" \
            -f Dockerfile.export-ci \
            -t eden-press-export-ci:local \
            .

      - name: Run export tests in the pinned no-system-Chrome container
        # Non-root (--user, matching the image's unprivileged `exporter`
        # user), --disable-dev-shm-usage (already baked into
        # convert/chrome.Session's launch flags as a DEFAULT — this adds a
        # generous --shm-size on top per Pitfall 11), and a unique
        # --user-data-dir per run (also already a Session default via
        # os.MkdirTemp). CHROME_PATH points at the copied-in pinned
        # headless-shell binary — the tier-2 resolution this whole job
        # exists to prove.
        #
        # 05.1-02 extends this SAME run command (same container, same
        # CHROME_PATH) to also build cmd/eden-press-export and drive the
        # compiled BINARY through a real pdf+png smoke
        # (scripts/export-binary-smoke.sh via `make export-binary-smoke`) —
        # proving the turnkey CLI argv→file path end-to-end where CHROME_PATH
        # resolves this pinned headless-shell. No new job, no new container,
        # no new flags: reusing the 05-05 export job is the point.
        #
        # GOFLAGS=-buildvcs=false: the container user (10001) does not own the
        # mounted checkout, so git refuses it ("dubious ownership") and `go
        # build` fails stamping VCS info ("error obtaining VCS status"). The
        # stamp is irrelevant to these test builds. For the same reason the
        # compile check writes its binary to /tmp, not into the read-only
        # checkout (export-binary-smoke builds its own copy in a temp dir).
        run: |
          docker run --rm \
            --user 10001:10001 \
            --shm-size=1g \
            -e CHROME_PATH=/headless-shell/headless-shell \
            -e HOME=/tmp \
            -e GOCACHE=/tmp/gocache \
            -e GOPATH=/tmp/gopath \
            -e GOFLAGS=-buildvcs=false \
            -e CHROME_VERSION="${CHROME_VERSION}" \
            -v "${{ github.workspace }}":/workspace \
            -w /workspace \
            eden-press-export-ci:local \
            bash -c "make export-test && go build -o /tmp/eden-press-export ./cmd/eden-press-export && make export-binary-smoke"
