# .github/workflows/oss-mirror.yml — OSS-01: keep the public copy of this repository in step with it.
#
# Rendered by scripts/cutover/install-mirror-workflows.sh (runbook step 19) and scripts/stage/oss/mirror-canary.sh
# from data/cutover/mirror/oss-mirror.yml.tmpl; do not edit the installed copy, change the template.
#
# This repository (in AOCyberAI) is the source of truth. The public copy is the legacy repository of the same name,
# which keeps its history through the org rename, so each run pushes only the new commits and tags.
#   - The App token comes from the aocyber-oss-mirror GitHub App (client id in the variable, private key in the
#     secret; both are shared from the AOCyberAI org to this repository only).
#   - vars.OSS_MIRROR_OWNER names the org that holds the public copy: the legacy org's name until the rename, the
#     renamed org after it. The same file therefore serves the canary and the real run.
#   - It pushes the default branch to the same branch name and the tags, by explicit refspec, so a pull-request ref
#     or a branch that exists only at the public copy is never pushed or deleted, and nothing is forced.
#   - The guard below keeps the job from running inside the public copy: this file is mirrored with everything else.
# The token stays in the step environment: the credential helper reads it when git calls it (never argv, never the URL).
# fetch-depth 0 is the safe value: a shallow checkout holds no other tags or remote-tracking branches, so it is only
# valid for a repository the canary-style test has shown to work with it.
name: oss-mirror

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

# One push at a time: a branch push and a tag push that land together would otherwise race on the same refs.
concurrency:
  group: oss-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository_owner == 'AOCyberAI'
    runs-on: ubuntu-latest
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OSS_MIRROR_WRITE_APP_CLIENT_ID }}
          private-key: ${{ secrets.OSS_MIRROR_WRITE_APP_PRIVATE_KEY }}
          owner: ${{ vars.OSS_MIRROR_OWNER }}
          repositories: eden-press
      - uses: actions/checkout@v5
        with:
          # An explicit ref, never the triggering one (eden-press#27). With no ref, checkout pins the triggering
          # commit: on a tag run it re-fetches +<sha>:refs/tags/<name> after +refs/tags/*, replacing the annotated
          # tag with a lightweight one, which the push below then created on the public copy (and every later run
          # was refused with "already exists"). Given a ref, checkout tests nothing against a commit, so the
          # all-history fetch (+refs/heads/*, +refs/tags/*) is the only one and every tag arrives as it is here.
          # The push takes the branch from refs/remotes/origin/main either way.
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: push the default branch and the tags
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          OWNER: ${{ vars.OSS_MIRROR_OWNER }}
          # a literal, not expanded here: git runs it as a shell function and its shell expands $1 and $TOKEN
          HELPER: '!f() { test "$1" = get || exit 0; while IFS= read -r l && test -n "$l"; do :; done; echo username=x-access-token; echo "password=$TOKEN"; }; f'
        run: |
          # The triggering tag must be what it is here: same commit, same kind (annotated stays annotated).
          if test "$GITHUB_REF_TYPE" = tag; then
            test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA" ||
              { echo "::error::refs/tags/$GITHUB_REF_NAME no longer points at $GITHUB_SHA"; exit 1; }
            echo "refs/tags/$GITHUB_REF_NAME is a $(git cat-file -t "refs/tags/$GITHUB_REF_NAME") object"
          fi
          git config --local --replace-all credential.helper ''
          git config --local --add credential.helper "$HELPER"
          # the default branch comes from its remote-tracking ref, as the all-history fetch left it
          if ! out=$(git push "${{ github.server_url }}/$OWNER/eden-press.git" \
            "refs/remotes/origin/main:refs/heads/main" 'refs/tags/*:refs/tags/*' 2>&1); then
            printf '%s\n' "$out"
            # Nothing here forces a tag, so a tag that differs on the public copy fails every run until it is fixed
            # there once, by hand (eden-press#27: v0.5.0 was pushed lightweight before this file pinned the ref).
            if printf '%s\n' "$out" | grep -q 'already exists'; then
              echo "::error::a tag on the public copy differs from this repository's; an operator must force-update it there once (see eden-press#27)"
            fi
            exit 1
          fi
          printf '%s\n' "$out"
