# Dart / Flutter tests (eden-press#25). AODex consumes bind/eden_press_model and
# bind/eden_docs by git ref, so a Dart regression on main would otherwise reach
# it with no CI signal. chase/model is in the path filter because
# chase/model/dart_golden_test.go writes the fixture the Dart model tests read:
# a Go-side model change can break them.
#
# bind/eden_ui is not in the matrix yet: on main it is not dart-format clean
# and `flutter analyze` reports 11 issues, so adding it would make this job red
# on its first run. It needs its own cleanup change first.
name: Dart

on:
  push:
    branches: [main]
    paths: ['bind/**', 'chase/model/**', '.github/workflows/dart.yml']
  pull_request:
    paths: ['bind/**', 'chase/model/**', '.github/workflows/dart.yml']

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.package }} (format / analyze / test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # eden_press_model is pure Dart (no Flutter dependency), so it runs
          # under the Dart CLI; the other two are Flutter packages. The Dart
          # SDK used is the one bundled with the pinned Flutter below.
          - package: eden_press_model
            tool: dart
          - package: eden_docs
            tool: flutter
          - package: dart
            tool: flutter
    defaults:
      run:
        working-directory: bind/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # The fleet pin (eden-ui-flutter's ci.yml uses the same), and the
          # floor every bind/ pubspec declares (flutter: ">=3.47.5"). Bump it
          # deliberately with those pubspecs, never let it float.
          flutter-version: '3.47.5'
          cache: true

      - name: Get dependencies
        run: ${{ matrix.tool }} pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: ${{ matrix.tool }} analyze

      - name: Test
        run: ${{ matrix.tool }} test
